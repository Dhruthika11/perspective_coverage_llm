analysis:
  clustering: stance_based
  kmeans_clusters: 2
  similarity_threshold: 0.744
  use_calibrated_threshold: false
  stance_method: nli
  nli_model: cross-encoder/nli-deberta-v3-small
  nli_batch_size: 32
calibration:
  mode: cluster
  nli_model: cross-encoder/nli-deberta-v3-small
  batch_size: 32
  max_perspectives_per_sample: 6
  n_llm_samples: 50
  max_cluster_pairs: 3000
  seed: 42
dataset:
  name: perspectrum
  claims_file: perspectrum_with_answers_v1.0.json
  dataset_split_file: dataset_split_v1.0.json
  evidence_pool_file: evidence_pool_v1.0.json
  perspective_pool_file: perspective_pool_v1.0.json
  processed_dir: data/processed/
  raw_dir: data/raw/perspectrum/
  datasets:
    perspectrum:
      name: perspectrum
      processed_dir: data/processed/
      raw_dir: data/raw/perspectrum/
    ibm_debater:
      name: ibm_debater
      processed_dir: data/processed/ibm_debater/
      raw_dir: data/raw/ibm_debater/
    kialo:
      name: kialo
      processed_dir: data/processed/kialo/
      raw_dir: data/raw/kialo/
embedding:
  batch_size: 32
  model: BAAI/bge-large-en-v1.5
  models:
    nomic: nomic-ai/nomic-embed-text-v1.5
    bge-large: BAAI/bge-large-en-v1.5
    bge-base: BAAI/bge-base-en-v1.5
    mpnet: sentence-transformers/all-mpnet-base-v2
  normalize: true
  query_instruction: 'search_query: '
generation:
  batch_size: 10
  checkpoint_every_n_claims: 10
llm:
  max_new_tokens: 512
  model: Qwen/Qwen2.5-7B-Instruct
  models:
    # --- Qwen 2.5 Family (Scaling Ladder) ---
    0.5b:
      name: Qwen/Qwen2.5-0.5B-Instruct
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 16
    1.5b:
      name: Qwen/Qwen2.5-1.5B-Instruct
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 10
    3b:
      name: Qwen/Qwen2.5-3B-Instruct
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 8
    qwen-7b:
      name: Qwen/Qwen2.5-7B-Instruct
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 6
    14b:
      name: Qwen/Qwen2.5-14B-Instruct
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 4
    32b:
      name: Qwen/Qwen2.5-32B-Instruct
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 2

    # --- Mistral Family ---
    7b:
      name: mistralai/Mistral-7B-Instruct-v0.3
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 6
    mistral-7b:
      name: mistralai/Mistral-7B-Instruct-v0.3
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 6

    # --- Meta LLaMA 3.x Family ---
    llama-1b:
      name: meta-llama/Llama-3.2-1B-Instruct
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 12
    llama-3b:
      name: meta-llama/Llama-3.2-3B-Instruct
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 8
    llama-8b:
      name: meta-llama/Llama-3.1-8B-Instruct
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 6


    # --- Google Gemma Family ---
    gemma-2b:
      name: google/gemma-2-2b-it
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 10
    gemma-9b:
      name: google/gemma-2-9b-it
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 4
    gemma-27b:
      name: google/gemma-2-27b-it
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 2

    # --- SmolLM2 Family (Sub-Billion Extremes) ---
    smollm2-135m:
      name: HuggingFaceTB/SmolLM2-135M-Instruct
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 24
    smollm2-360m:
      name: HuggingFaceTB/SmolLM2-360M-Instruct
