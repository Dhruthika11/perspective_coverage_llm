      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 20
    smollm2-1.7b:
      name: HuggingFaceTB/SmolLM2-1.7B-Instruct
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 12

    # --- OLMoE Family (Sparse MoE 1B-7B) ---
    olmoe-1b-7b:
      name: allenai/OLMoE-1B-7B-0924-Instruct
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 6

    # --- OLMo 2 Family (Post-Training Alignment Ladder: Base -> SFT -> DPO -> Instruct) ---
    # 1B Scale
    olmo2-1b-base:
      name: allenai/OLMo-2-0425-1B
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
