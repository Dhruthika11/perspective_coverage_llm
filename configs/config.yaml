    olmo2-1b-instruct:
      name: allenai/OLMo-2-0425-1B-Instruct
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 16

    # 7B Scale
    olmo2-7b-base:
      name: allenai/OLMo-2-1124-7B
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 6
    olmo2-7b-sft:
      name: allenai/OLMo-2-1124-7B-SFT
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 6
    olmo2-7b-dpo:
      name: allenai/OLMo-2-1124-7B-DPO
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 6
    olmo2-7b-instruct:
      name: allenai/OLMo-2-1124-7B-Instruct
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 6

    # 13B Scale
    olmo2-13b-base:
      name: allenai/OLMo-2-1124-13B
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 4
    olmo2-13b-sft:
      name: allenai/OLMo-2-1124-13B-SFT
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 4
    olmo2-13b-dpo:
      name: allenai/OLMo-2-1124-13B-DPO
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 4
    olmo2-13b-instruct:
      name: allenai/OLMo-2-1124-13B-Instruct
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 4

    # 32B Scale
    olmo2-32b-base:
      name: allenai/OLMo-2-0325-32B
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 2
    olmo2-32b-sft:
      name: allenai/OLMo-2-0325-32B-SFT
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 2
    olmo2-32b-dpo:
      name: allenai/OLMo-2-0325-32B-DPO
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 2
    olmo2-32b-instruct:
      name: allenai/OLMo-2-0325-32B-Instruct
      provider: huggingface
      temperature: 0.8
      top_p: 0.95
      max_new_tokens: 512
      batch_size: 2

    judge-qwen:
      max_new_tokens: 10
      name: openai/gpt-oss-120b
      provider: groq
      temperature: 0.0
      top_p: 1.0
  num_samples_per_claim: 5
  prompt_strategy: dynamic_aspects
  dynamic_aspects:
    - "Economic or Financial"
    - "Ethical, Moral, or Cultural"
    - "Legal, Institutional, or Policy"
    - "Practical, Pragmatic, or Implementation"
    - "Social, Demographic, or Interpersonal"
    - "Scientific or Technological"
    - "Historical or Long-term"
    - "Global or International"
  dynamic_prompt_template: 'You are analyzing the controversial claim: "{claim}"

    Task: Provide one single, distinct, and focused argument about this claim strictly from an {aspect} perspective.
    Do not provide a balanced overview. Take one clear, atomic stance (either SUPPORT or UNDERMINE).
    {history_constraint}
    Respond with ONLY a single JSON object matching this schema:
    {{
      "stance": "support" or "undermine",
      "perspective_summary": "1 concise sentence stating the core claim",
      "core_reasoning": "1-2 sentences explaining the supporting logic"
    }}'
  provider: huggingface
  seed: 42
  temperature: 0.8
  top_p: 0.95
paths:
  embeddings_dir: results/embeddings/
  figures_dir: results/figures/
  llm_outputs_processed: data/llm_outputs/processed_generations.csv
  llm_outputs_raw: data/llm_outputs/raw_generations/
  metrics_dir: results/metrics/
  summary_file: results/final_report_summary.json
